<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMReadyVR - Hazard Recognition</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <a-scene background="color: #87CEEB">
    <a-assets>
      <a-mixin id="hazard-hitbox" material="color: #ffffff; transparent: true; opacity: 0.01">
      </a-mixin>
    </a-assets>

    <!-- Langit dan lingkungan -->
    <a-sky color="#87CEEB"></a-sky>
    <a-plane position="0 0 -8" rotation="-90 0 0" width="40" height="40" color="#5C9E45"></a-plane>

    <!-- Jalan -->
    <a-plane position="0 0.02 -8" rotation="-90 0 0" width="8" height="35" color="#42464B"></a-plane>
    <a-entity position="0 0.04 -8">
      <a-box position="0 0 -2" width="0.12" height="0.02" depth="2" color="#F8F5D7"></a-box>
      <a-box position="0 0 -6" width="0.12" height="0.02" depth="2" color="#F8F5D7"></a-box>
      <a-box position="0 0 -10" width="0.12" height="0.02" depth="2" color="#F8F5D7"></a-box>
      <a-box position="0 0 -14" width="0.12" height="0.02" depth="2" color="#F8F5D7"></a-box>
    </a-entity>

    <!-- Petunjuk -->
    <a-text value="HAZARD RECOGNITION" position="0 3.7 -6" align="center" color="#17202A" width="8"
      scale="1.3 1.3 1.3"></a-text>
    <a-text value="Klik 3 objek berbahaya untuk mempelajari cara menghadapinya" position="0 3.25 -6" align="center"
      color="#17202A" width="8"></a-text>

    <!-- Objek 1: kerucut lalu lintas -->
    <a-entity id="coneObject" position="-2.4 0 -6">
      <a-cone position="0 0.65 0" radius-bottom="0.42" radius-top="0.06" height="1.3" color="#F47C20"></a-cone>
      <a-cylinder position="0 0.08 0" radius="0.48" height="0.16" color="#FFFFFF"></a-cylinder>
      <a-box position="0 0.65 0.02" width="0.42" height="0.12" depth="0.43" color="#FFFFFF"></a-box>
      <a-box mixin="hazard-hitbox" class="clickable" position="0 0.8 0.15" width="1.5" height="1.8" depth="0.5"></a-box>
      <a-text value="KERUCUT" position="0 1.9 0" align="center" color="#17202A" width="3"></a-text>
    </a-entity>

    <!-- Objek 2: penghalang jalan -->
    <a-entity id="barrierObject" position="2.2 0 -6.5">
      <a-box position="0 0.75 0" width="2.3" height="0.8" depth="0.45" color="#F3F3F3"></a-box>
      <a-box position="0 0.75 0.24" width="0.42" height="0.82" depth="0.04" rotation="0 0 18" color="#E53935"></a-box>
      <a-box position="-0.75 0.75 0.24" width="0.42" height="0.82" depth="0.04" rotation="0 0 18"
        color="#E53935"></a-box>
      <a-box position="0.75 0.75 0.24" width="0.42" height="0.82" depth="0.04" rotation="0 0 18"
        color="#E53935"></a-box>
      <a-box position="-0.75 0.15 0" width="0.18" height="0.3" depth="0.35" color="#42464B"></a-box>
      <a-box position="0.75 0.15 0" width="0.18" height="0.3" depth="0.35" color="#42464B"></a-box>
      <a-box mixin="hazard-hitbox" class="clickable" position="0 0.85 0.35" width="3.2" height="1.7" depth="0.5"></a-box>
      <a-text value="PENGHALANG" position="0 1.55 0" align="center" color="#17202A" width="4"></a-text>
    </a-entity>

    <!-- Objek 3: pejalan kaki -->
    <a-entity id="pedestrianObject" position="-0.8 0 -10">
      <a-sphere position="0 1.65 0" radius="0.28" color="#E9B98D"></a-sphere>
      <a-cylinder position="0 1.05 0" radius="0.22" height="0.85" color="#2878B5"></a-cylinder>
      <a-cylinder position="-0.15 0.42 0" radius="0.09" height="0.75" color="#263238"></a-cylinder>
      <a-cylinder position="0.15 0.42 0" radius="0.09" height="0.75" color="#263238"></a-cylinder>
      <a-cylinder position="-0.34 1.05 0" radius="0.07" height="0.65" rotation="0 0 25" color="#E9B98D"></a-cylinder>
      <a-cylinder position="0.34 1.05 0" radius="0.07" height="0.65" rotation="0 0 -25" color="#E9B98D"></a-cylinder>
      <a-box mixin="hazard-hitbox" class="clickable" position="0 1.1 0.3" width="1.35" height="2.6" depth="0.6"></a-box>
      <a-text value="PEJALAN KAKI" position="0 2.25 0" align="center" color="#17202A" width="4"></a-text>
    </a-entity>

    <!-- Panel informasi: tombol berada di depan panel agar mudah diklik -->
    <a-entity id="infoPanel" visible="false" scale="0 0 0" position="0 2 -3.1">
      <a-plane position="0 0 0" width="6.4" height="3.4" color="#FFFFFF"
        material="shader: flat; opacity: 0.98"></a-plane>
      <a-text id="infoTitle" value="INFORMASI BAHAYA" position="0 1.15 0.08" align="center" color="#16324F" width="5.8"
        wrap-count="32"></a-text>
      <a-text id="infoBody" value="" position="-2.65 0.55 0.08" align="left" anchor="left" baseline="top"
        color="#17202A" width="5.3" wrap-count="55"></a-text>
      <a-box id="closePanel" class="clickable" position="0 -1.15 0.28" width="2.5" height="0.65" depth="0.18"
        color="#C62828"></a-box>
      <a-text value="TUTUP" position="0 -1.15 0.4" align="center" color="#FFFFFF" width="3"
        scale="1.1 1.1 1.1"></a-text>
    </a-entity>

    <!-- Panel selesai -->
    <a-entity id="donePanel" visible="false" scale="0 0 0" position="0 2 -3">
      <a-plane width="5.8" height="2.8" color="#FFFFFF" position="0 0 0"></a-plane>
      <a-text value="HEBAT! SEMUA BAHAYA SUDAH DIPELAJARI" position="0 0.65 0.08" align="center" color="#16324F"
        width="5.2" wrap-count="32"></a-text>
      <a-box id="continueButton" class="clickable" position="0 -0.65 0.28" width="3.2" height="0.7" depth="0.18"
        color="#168447"></a-box>
      <a-text value="LANJUT QUIZ" position="0 -0.65 0.4" align="center" color="#FFFFFF" width="4"></a-text>
    </a-entity>

    <!-- Navigasi bawah -->
    <a-box id="backButton" class="clickable" position="-2.8 0.55 -2.7" width="1.5" height="0.55" depth="0.18"
      color="#34495E"></a-box>
    <a-text value="KEMBALI" position="-2.8 0.55 -2.57" align="center" color="#FFFFFF" width="2.2"></a-text>
    <a-box id="homeButton" class="clickable" position="2.8 0.55 -2.7" width="1.5" height="0.55" depth="0.18"
      color="#34495E"></a-box>
    <a-text value="HOME" position="2.8 0.55 -2.57" align="center" color="#FFFFFF" width="2"></a-text>

    <!-- Mouse cursor/raycaster: satu saja untuk seluruh tombol dan objek -->
    <a-entity id="mouseCursor" cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; far: 40; interval: 0">
    </a-entity>

    <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
  </a-scene>

  <script>
    (() => {
      const found = new Set();
      const infoPanel = document.querySelector('#infoPanel');
      const donePanel = document.querySelector('#donePanel');
      const infoTitle = document.querySelector('#infoTitle');
      const infoBody = document.querySelector('#infoBody');

      const hazardInfo = {
        coneObject: {
          title: 'KERUCUT LALU LINTAS',
          body: 'Bahaya: kerucut menandakan area kerja atau jalur yang dibatasi.\\n\\nCara aman:\\n• Kurangi kecepatan.\\n• Ikuti arah jalur yang tersedia.\\n• Jangan menerobos area yang ditutup.'
        },
        barrierObject: {
          title: 'PENGHALANG JALAN',
          body: 'Bahaya: penghalang menunjukkan jalur yang tidak boleh dilalui.\\n\\nCara aman:\\n• Jangan melewati penghalang.\\n• Perhatikan rambu dan petunjuk petugas.\\n• Berpindahlah jalur hanya jika aman.'
        },
        pedestrianObject: {
          title: 'PEJALAN KAKI',
          body: 'Bahaya: pejalan kaki dapat menyeberang atau berada dekat jalan.\\n\\nCara aman:\\n• Kurangi kecepatan dan waspada.\\n• Beri jalan kepada pejalan kaki.\\n• Jaga jarak aman dan jangan menggunakan ponsel saat berkendara.'
        }
      };

      function showHazard(id) {
        const data = hazardInfo[id];
        if (!data) return;
        infoTitle.setAttribute('value', data.title);
        infoBody.setAttribute('value', data.body.replace(/\\n/g, '\n'));
        infoPanel.setAttribute('visible', true);
        infoPanel.setAttribute('scale', '1 1 1');
        donePanel.setAttribute('visible', false);
        donePanel.setAttribute('scale', '0 0 0');
        found.add(id);
      }

      function closeInfo() {
        infoPanel.setAttribute('visible', false);
        infoPanel.setAttribute('scale', '0 0 0');
        if (found.size === 3) {
          window.setTimeout(() => {
            donePanel.setAttribute('visible', true);
            donePanel.setAttribute('scale', '1 1 1');
          }, 150);
        }
      }

      Object.keys(hazardInfo).forEach(id => {
        const hitbox = document.querySelector('#' + id + ' .clickable');
        if (hitbox) hitbox.addEventListener('click', () => showHazard(id));
      });

      document.querySelector('#closePanel').addEventListener('click', () => {
        if (!infoPanel.getAttribute('visible')) return;
        closeInfo();
      });
      document.querySelector('#continueButton').addEventListener('click', () => {
        if (!donePanel.getAttribute('visible')) return;
        window.location.href = 'quiz.html';
      });
      document.querySelector('#backButton').addEventListener('click', () => {
        window.location.href = 'situasi.html';
      });
      document.querySelector('#homeButton').addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    })();
  </script>
</body>

</html>

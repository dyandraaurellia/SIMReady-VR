<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SIMReady VR</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <!-- Environment -->
      <a-sky color="#87CEEB"></a-sky>

      <!-- Ground -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="30" height="30" color="#D9D9D9"> </a-plane>

      <!-- Judul -->
      <a-text value="SIMREADY VR" position="0 3 -5" align="center" width="8" color="#111111"> </a-text>

      <a-text value="Virtual Road Safety Learning" position="0 2.4 -5" align="center" width="5" color="#333333"> </a-text>

      <!-- Tombol Mulai -->
      <a-box id="startButton" class="clickable" position="0 1.3 -4" width="3" height="0.8" depth="0.15" color="#444444"> </a-box>

      <a-text value="MULAI" position="0 1.3 -3.9" align="center" width="4" color="#FFFFFF"> </a-text>

      <!-- Keterangan -->
      <a-text value="Pelajari rambu, situasi jalan,\nhazard, dan uji pemahamanmu." position="0 0.4 -4" align="center" width="4" color="#222222"> </a-text>

      <!-- Camera + Cursor -->
      <a-camera position="0 1.6 0">
        <a-cursor color="#000000" raycaster="objects: .clickable"> </a-cursor>
      </a-camera>
    </a-scene>

    <script>
      document.querySelector("#startButton").addEventListener("click", function () {
        window.location.href = "rambu.html";
      });
    </script>
  </body>
</html>
